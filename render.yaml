services:
  - type: web
    name: last-pick-workshop
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PIN
        sync: false
    disk:
      name: last-pick-data
      mountPath: /var/data
      sizeGB: 1
