:root{
  --bg:#eef0fa;--panel:#ffffff;--panel2:#f1f2fc;--ink:#161a3a;--mut:#5b628f;--line:#d6daf0;
  --pri:#4a47f5;--on-pri:#ffffff;--hot:#ff6a2b;--good:#0f9d76;--bad:#e23b5a;--gold:#f5b700;
  --hdr:#161a3a;--on-hdr:#ffffff;--shade:#cdd1ec;--scrim:rgba(14,16,38,.55);
  --f-d:"Gmarket Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-b:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f25;--panel:#171a3b;--panel2:#1f2350;--ink:#eef0ff;--mut:#9aa1d8;--line:#2d3266;
    --pri:#8280ff;--on-pri:#0d0f25;--hot:#ff8a4d;--good:#2fd3a3;--bad:#ff6a85;--gold:#ffd23f;
    --hdr:#080a1c;--on-hdr:#ffffff;--shade:#05061a;--scrim:rgba(3,4,16,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f25;--panel:#171a3b;--panel2:#1f2350;--ink:#eef0ff;--mut:#9aa1d8;--line:#2d3266;
  --pri:#8280ff;--on-pri:#0d0f25;--hot:#ff8a4d;--good:#2fd3a3;--bad:#ff6a85;--gold:#ffd23f;
  --hdr:#080a1c;--on-hdr:#ffffff;--shade:#05061a;--scrim:rgba(3,4,16,.7);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.mut{color:var(--mut)}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:8px;height:54px;padding:0 10px;background:var(--hdr);color:var(--on-hdr)}
.brand{font-family:var(--f-d);font-size:19px;letter-spacing:.01em;white-space:nowrap}
.hb{min-width:44px;height:38px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.12);font-size:15px;font-weight:700;color:var(--on-hdr)}
.hb.on{background:var(--hot);color:#1a0d05}
.main{max-width:640px;margin:0 auto;padding:16px 14px 60px}
.h2{font-family:var(--f-d);font-size:22px;margin:26px 0 10px}
.h3{font-weight:700;font-size:16px;margin:16px 0 6px}

/* generic */
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--shade);margin:10px 0}
.card.flat{box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-weight:500;font-size:14px}
.chip.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.chip.me{border-color:var(--hot);font-weight:700}
.chip.dim{opacity:.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;min-height:44px;border-radius:12px;background:var(--pri);color:var(--on-pri);font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.hot{background:var(--hot);color:#1a0d05}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--shade);border:2px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.good{background:var(--good);color:#04251c}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{height:8px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);border:1.5px solid var(--line)}
.tag.hot{background:var(--hot);border-color:var(--hot);color:#1a0d05}
.tag.good{background:var(--good);border-color:var(--good);color:#04251c}
.tag.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.note{border-left:5px solid var(--hot);background:var(--panel2);border-radius:0 12px 12px 0;padding:10px 12px;margin:10px 0}
.err{color:var(--bad);font-weight:700;margin-top:8px}
ul.dots{margin:6px 0;padding-left:20px}
ul.dots li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.kv b{white-space:nowrap}

/* hero */
.hero{border-radius:22px;padding:22px 18px 20px;background:linear-gradient(140deg,#2b27d9 0%,#4a47f5 45%,#7a3df0 100%);color:#fff;box-shadow:0 5px 0 #1d1aa0;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-d);font-size:38px;line-height:1.12;letter-spacing:.01em}
.hero p{margin-top:8px;opacity:.92}
.hero .chips{margin-top:14px}
.hero .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;font-size:13px;padding:4px 10px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,43,.9),rgba(255,106,43,0) 70%)}
.tip{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--hot);color:#1a0d05;font-weight:700}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:4px solid var(--line)}
.tl li{position:relative;margin:0 0 10px}
.tl li::before{content:"";position:absolute;left:-27px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:4px solid var(--pri)}
.tl li.go::before{border-color:var(--hot)}
.tl button,.tl .it{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--shade)}
.tl .tm{font-weight:700;font-size:13px;color:var(--pri);min-width:92px}
.tl .ic{font-size:20px}
.tl .nm{font-weight:700;flex:1}
.tl .ar{color:var(--mut)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 8px;text-align:center;border-bottom:1.5px solid var(--line)}
.tbl th{font-size:12.5px;color:var(--mut);font-weight:700}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.foc td{background:var(--panel2)}
.tbl .pt{font-family:var(--f-d);font-size:17px;color:var(--pri)}
.scroll{overflow-x:auto;max-width:100%}
.win{color:var(--good);font-weight:700}
.lose{color:var(--bad);font-weight:700}

/* demo blocks */
.demo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.bub{padding:6px 12px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-weight:700}
.bub.ok{background:var(--good);border-color:var(--good);color:#04251c}
.bub.no{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{font-weight:700}

/* power cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{--c:#888;position:relative;overflow:hidden;border-radius:18px;padding:14px 12px 12px;color:#fff;min-height:168px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 80%,#000) 0%,color-mix(in srgb,var(--c) 35%,#0d0f25) 100%);
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#000);display:flex;flex-direction:column;gap:2px}
.pcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.26) 50%,transparent 65%);background-size:280% 100%;animation:foil 5s ease-in-out infinite}
.pcard .em{font-size:34px;line-height:1}
.pcard .hn{font-family:var(--f-d);font-size:20px;margin-top:6px}
.pcard .pn{font-size:13px;font-weight:700;opacity:.95}
.pcard .lock{margin-top:auto;padding-top:10px;font-size:12px;opacity:.9}
.ghost{display:grid;gap:5px;margin-top:10px}
.ghost i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.28);filter:blur(1.5px)}
.ghost i:nth-child(2){width:82%}.ghost i:nth-child(3){width:55%}
.pcard.open{grid-column:1/-1}
.pcard.open::after{animation:none;background:none}
.pcard .dt{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.pcard .dt li{margin:3px 0;padding-left:14px;position:relative}
.pcard .dt li::before{content:"•";position:absolute;left:2px}
.pcard .by{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.35);font-size:12px;font-weight:700}
.pcard .last{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.25);font-size:12px;font-weight:700}
.mycard{--c:#888;position:relative;overflow:hidden;border-radius:22px;padding:22px 18px;color:#fff;margin:10px 0;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 30%,#0d0f25));
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,#000)}
.mycard .em{font-size:52px;line-height:1}
.mycard h3{font-family:var(--f-d);font-size:28px;margin-top:6px}
.mycard .pn{font-weight:700;opacity:.95}
.mycard ul{margin:12px 0 0;padding-left:18px}
.mycard li{margin:5px 0}
.drawbox{text-align:center;padding:26px 14px}
.drawbox .back{width:130px;height:180px;margin:0 auto 14px;border-radius:18px;background:repeating-linear-gradient(45deg,#2b27d9 0 10px,#3d38f0 10px 20px);border:4px solid #fff;box-shadow:0 6px 0 #1d1aa0,0 0 0 3px var(--pri);display:grid;place-items:center;font-family:var(--f-d);font-size:60px;color:#fff}
.drawbox .back.shuf{animation:shuf .5s ease-in-out infinite alternate}

/* drawer */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(82vw,320px);z-index:31;background:var(--panel);border-left:3px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px;animation:slidein .18s ease-out}
.drawer .mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;font-weight:700;font-size:16px;text-align:left}
.drawer .mi.on{background:var(--pri);color:var(--on-pri)}
.drawer .mi.adm{border:2px dashed var(--hot)}
.drawer .who{margin-top:auto;padding:12px;border-radius:14px;background:var(--panel2)}

/* login */
.login{text-align:center;padding-top:10px}
.login h1{font-family:var(--f-d);font-size:30px;margin-bottom:6px}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.namegrid button{padding:12px 6px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:700;box-shadow:0 3px 0 var(--shade)}
.namegrid button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.namegrid button small{display:block;font-weight:400;font-size:11px;opacity:.8}
.pin{width:100%;text-align:center;font-size:26px;letter-spacing:.6em;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--panel);margin-bottom:12px}
.in{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel)}

/* modal / popup */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow-y:auto}
.box{width:min(100%,460px);max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--shade);animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
.box h3{font-family:var(--f-d);font-size:24px;margin-bottom:8px}
.box.big{text-align:center}
.pop-teams{display:grid;gap:10px;margin-top:10px;text-align:left}
.pt{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2)}
.pt h4{font-family:var(--f-d);font-size:17px;margin-bottom:6px;color:var(--pri)}
.pn2{display:inline-block;margin:3px 5px 3px 0;padding:5px 12px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:700;opacity:0;animation:rise .35s forwards}
.pn2.me{border-color:var(--hot);background:var(--hot);color:#1a0d05}
.pn2.hl{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.pop-note{margin-top:12px;font-weight:700}
.dice{width:110px;height:110px;margin:14px auto;border-radius:24px;background:#fff;color:#161a3a;display:grid;place-items:center;font-family:var(--f-d);font-size:64px;border:4px solid var(--pri);box-shadow:0 5px 0 var(--shade)}
.dice.roll{animation:wob .25s linear infinite}
.bigtxt{font-family:var(--f-d);font-size:46px;margin:6px 0}
.bigtxt.plus{color:var(--good)}.bigtxt.minus{color:var(--bad)}
.priv{width:100%;padding:34px 10px;border-radius:20px;background:repeating-linear-gradient(45deg,#2b27d9 0 10px,#3d38f0 10px 20px);color:#fff;font-family:var(--f-d);font-size:24px;border:4px solid #fff;box-shadow:0 5px 0 #1d1aa0}
.lines p{margin:6px 0;font-weight:500}
.lines p:first-child{font-weight:700;font-size:17px}
.emo{font-size:54px;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:80;max-width:88vw;padding:10px 16px;border-radius:12px;background:var(--hdr);color:var(--on-hdr);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* admin */
.abar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;background:var(--panel2);border:2px dashed var(--hot);margin-bottom:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:999px;font-weight:700;background:var(--panel);border:2px solid var(--line)}
.tabs button.on{background:var(--hot);color:#1a0d05;border-color:var(--hot)}
.tool h3{font-size:16px;font-weight:700;margin-bottom:2px}
.tool .btn{margin-top:8px}
.warn{color:var(--bad);font-weight:700}
.led{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1.5px solid var(--line);font-size:13.5px}
.led .x{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);font-weight:700}
.tgl{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.sw{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--good)}.sw.on::after{left:23px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1.5px solid var(--line)}
.lrow .q{font-size:13.5px}
.rank1{background:linear-gradient(90deg,rgba(245,183,0,.28),transparent)}
.medal{font-size:20px}
details.pl{border:2px solid var(--line);border-radius:14px;background:var(--panel);margin:8px 0;box-shadow:0 3px 0 var(--shade)}
details.pl summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;font-weight:700}
details.pl summary::-webkit-details-marker{display:none}
details.pl.me{border-color:var(--hot)}
details.pl .bd{padding:0 12px 12px}
.sc{margin-left:auto;font-family:var(--f-d);font-size:22px;color:var(--pri)}

@keyframes foil{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(10px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
@keyframes shuf{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  .pcard::after,.drawbox .back.shuf,.dice.roll{animation:none}
  .drawer,.box,.pn2{animation-duration:.01s}
}

/* v2 추가 */
.hb{position:relative}
.bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--hot);color:#1a0d05;font-size:11px;font-weight:700;display:grid;place-items:center}
.brand .tag{font-family:var(--f-b);font-size:11px;vertical-align:middle}
.chat{display:flex;flex-direction:column;gap:10px;min-height:42vh;padding:6px 0 12px}
.msg{max-width:86%;font-size:14.5px}
.msg i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}
.msg.usr .who{font-size:12.5px;font-weight:700;margin-bottom:2px}
.msg.usr .bub2{display:inline-block;padding:8px 12px;border-radius:4px 16px 16px 16px;background:var(--panel);border:2px solid var(--line)}
.msg.usr.mine{align-self:flex-end;text-align:right}
.msg.usr.mine .bub2{border-radius:16px 4px 16px 16px;background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.msg.usr.staff .bub2{background:var(--hot);color:#1a0d05;border-color:var(--hot);font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.msg.sys{align-self:center;max-width:94%;text-align:center;background:var(--panel2);border:2px dashed var(--line);border-radius:14px;padding:7px 12px;font-weight:700}
.msg.notice{align-self:stretch;max-width:100%;background:var(--pri);color:var(--on-pri);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.msg.notice b{display:block;font-family:var(--f-d);font-size:15px;margin-bottom:2px}
.msg.notice span{font-size:16px;font-weight:700}
.msg.notice i{color:inherit;opacity:.8}
.chatbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;gap:8px;align-items:center;padding:8px;margin-top:6px;background:var(--bg);border-top:2px solid var(--line)}
.chatbar .in{flex:1;width:auto}
.lrow2{padding:10px 0;border-bottom:1.5px solid var(--line)}
.lrow2 .q{margin-bottom:6px}
.lrow2 .qt{color:var(--ink);font-size:14.5px;font-weight:700;margin-top:2px}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.chip.tm{background:var(--panel);border-style:dashed}
.betgrp{margin-top:10px;padding:8px;border-radius:12px;background:var(--panel2)}
.betrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:700}
.betrow:last-child{border-bottom:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-weight:700;font-size:13.5px;background:var(--panel)}
.seg button.on{background:var(--mut);color:var(--panel)}
.seg button.on.win{background:var(--good);color:#04251c}
.seg button.on.lose{background:var(--bad);color:#fff}
.pcard .crow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pcard .cb{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.92);color:#161a3a;font-weight:700;font-size:13px}
.pcard .cb[disabled]{opacity:.5}

.loginbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:12px;border-radius:14px;background:var(--panel);border:2px solid var(--hot);font-weight:700;box-shadow:0 3px 0 var(--shade)}
.loginbar .btn{min-height:38px;padding:8px 18px}

.slots{display:grid;gap:10px;text-align:center}
.slot{padding:10px 12px;border:3px dashed var(--line);border-radius:16px;background:var(--panel2)}
.slot small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.slot b{display:block;font-family:var(--f-d);font-size:30px;line-height:1.3}
.slot.lock{border-style:solid;border-color:var(--hot);animation:pop .3s}
.slot.me{background:var(--hot);color:#1a0d05}
.slot.me small{color:#1a0d05}

.qlist{margin:4px 0 10px;padding-left:22px}
.qlist li{margin:3px 0;font-weight:700}
.lgs{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:6px}
.lt{display:flex;align-items:center;gap:8px}

.quote{margin:8px 0 4px;padding:8px 12px;border-radius:12px;background:var(--panel2);font-style:italic;font-weight:700;font-size:15.5px;line-height:1.45}

.envs{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.env{width:46px;height:58px;border-radius:12px;background:var(--panel2);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-d);font-size:24px;opacity:.5}
.env.pick{opacity:1;background:var(--hot);color:#1a0d05;border-color:var(--hot);transform:translateY(-8px) scale(1.12);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.big{padding:14px 18px;font-size:16px}
.rbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-top:10px;border-radius:14px;border:3px solid var(--line);background:var(--panel2)}
.rbtn .em{font-size:30px}
.note.qadm{margin-top:10px}

.via{margin:0 0 10px;padding:8px 12px;border-radius:12px;background:#ffd23f;color:#1a1400;font-weight:700;font-size:14px}

/* v3: 럭키 카드 연출, 승패 안내, 점심 팀 행 */
.cards3{position:relative;height:170px;margin:4px 0}
.cd{position:absolute;top:0;width:31%;height:170px;transition:left .28s ease,transform .3s,opacity .3s;perspective:700px}
.cdi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s}
.cd.flip .cdi{transform:rotateY(180deg)}
.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}

/* =============== 유틸 =============== */
function $(s,el){return (el||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}
function fmt(n){return (n>0?'+':'')+n;}
function uuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function rnd(n){
  try{
    var a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;
    do{crypto.getRandomValues(a);}while(a[0]>=lim);
    return a[0]%n;
  }catch(e){return Math.floor(Math.random()*n);}
}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function withTimeout(p,ms,label){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error((label||'서버')+' 응답이 없어요'));},ms);
    p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
  });
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function heroOf(id){return HEROES.filter(function(h){return h.id===id;})[0];}
async function sha(s){
  if(!window.crypto||!crypto.subtle)throw new Error('보안 연결(https) 주소로 접속해야 로그인할 수 있어요');
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tfws:'+s));
  return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');
}
function setPath(p,v){

}
function getPath(p){var a=p.split('.'),o=S;for(var i=0;i<a.length;i++){if(o==null)return undefined;o=o[a[i]];}return o;}

/* =============== Firebase 연결 =============== */
function cfg(){return window.APP_CONFIG||{};}
function snapWrap(s){return {id:s.id,exists:!!s.exists,data:function(){return s.data();}};}
function mkDb(fs){
  function wrapDoc(ref){
    return {path:ref.path,id:ref.id,
      get:async function(){return snapWrap(await ref.get());},
      set:function(d){return ref.set(d);},
      update:function(d){return ref.update(d);},
      delete:function(){return ref.delete();},
      onSnapshot:function(n,e){return ref.onSnapshot(function(s){n(snapWrap(s));},e);}
    };
  }
  return {
    transactMulti:function(paths,fn){
      return fs.runTransaction(async function(tx){
        var snaps=[];
        for(var i=0;i<paths.length;i++)snaps.push(await tx.get(fs.doc(paths[i])));
        var out=fn(snaps.map(function(s){return s.exists?s.data():null;}));
        if(out&&out.write)tx.set(fs.doc(out.write.path),out.write.data);
        return out;
      });
    },
    transact:function(p,fn){
      var ref=fs.doc(p);
      return fs.runTransaction(async function(tx){
        var s=await tx.get(ref),next=fn(s.exists?s.data():null);
        if(next!==undefined)tx.set(ref,next);
        return next;
      });
    },
    doc:function(p){return wrapDoc(fs.doc(p));},
    collection:function(p){
      return {path:p,
        onSnapshot:function(n,e){return fs.collection(p).onSnapshot(function(q){n({docs:q.docs.map(snapWrap)});},e);},
        recent:function(n,cb,e){return fs.collection(p).orderBy('ts','desc').limit(n).onSnapshot(function(q){cb({docs:q.docs.map(snapWrap)});},e);},
        add:function(d){return fs.collection(p).add(d);},
        list:async function(){var q=await fs.collection(p).get();return q.docs.map(function(d){return d.id;});},
        doc:function(id){return wrapDoc(fs.doc(p+'/'+id));}};
    }
  };
}
function connMsg(){
  if(S.libMissing)return 'Firebase 라이브러리를 불러오지 못했어요. 인터넷 연결이나 광고 차단 앱을 확인하고 새로고침해 주세요.';
  if(S.cfgMissing)return 'config.js에 Firebase 설정값이 아직 없어요. 값을 붙여넣고 GitHub에 다시 올려 주세요.';
  var c=S.err||'';
  if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')return 'Firebase에서 “익명 로그인”이 꺼져 있어요. Authentication → Sign-in method에서 익명을 켜 주세요.';
  if(c==='auth/invalid-api-key'||c==='auth/api-key-not-valid.-please-pass-a-valid-api-key.')return 'config.js의 apiKey가 올바르지 않아요. 값을 다시 복사해 주세요.';
  if(c==='permission-denied')return 'Firestore 규칙이 게시되지 않았거나 잘못됐어요. firestore.rules를 다시 붙여넣고 게시해 주세요.';
  if(c==='timeout')return '서버 응답이 없어요. 인터넷 연결과 config.js 값(projectId, authDomain)을 확인해 주세요.';
  return '서버에 연결하지 못했어요'+(c?' ('+c+')':'')+'. 인터넷 연결을 확인하고 새로고침해 주세요.';
}
window.addEventListener('error',function(e){S.jsErr=e.message;});
async function init(){
  S.setup=(location.hash==='#setup');
  render(true);
  var fbc=cfg().firebase||{};
  if(!window.firebase){S.libMissing=true;S.ready=true;render(true);return;}
  if(!fbc.apiKey||fbc.apiKey.indexOf('여기')===0){S.cfgMissing=true;S.ready=true;render(true);return;}
  try{
    firebase.initializeApp(fbc);
    var auth=firebase.auth();
    try{if(auth.setPersistence&&firebase.auth.Auth&&firebase.auth.Auth.Persistence)await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);}catch(e){console.error(e);}
    var u=await Promise.race([
      new Promise(function(res){var off=auth.onAuthStateChanged(function(x){off();res(x);});}),
      new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'});},10000);})
    ]);
    if(!u){await auth.signInAnonymously();u=auth.currentUser;}
    S.uid=u.uid;
    S.db=mkDb(firebase.firestore());
  }catch(e){console.error(e);S.err=(e&&e.code)||(e&&e.message)||'init';}
  try{S.chatSeen=+(localStorage.getItem('tfchat_seen')||0);}catch(e){}
  S.ready=true;
  if(S.db&&S.uid)startSubs();
  setInterval(function(){
    if(!S.admin||!S.db||S.resetting)return;
    if(S.dealing&&Date.now()-(S.dealStart||0)>25000)S.dealing=false;     // 멈춰 있으면 풀어줘요
    adminTick();
  },10000);
  render(true);
}
function subErr(e){S.err=(e&&e.code)||'error';render();}
function startSubs(){
  var db=S.db;
  db.collection('public').onSnapshot(function(s){
    var m={};s.docs.forEach(function(d){m[d.id]=clone(d.data());});
    handlePub(m);
  },subErr);
  db.doc('players/'+S.uid).onSnapshot(function(s){      // 내 접속 정보 하나만 구독해요 (다른 사람 변경으로 읽기가 늘지 않게)
    var m=Object.assign({},S.players);
    if(s.exists)m[S.uid]=s.data();else delete m[S.uid];
    S.players=m;playersChanged();
  },subErr);

  db.doc('deal/'+S.uid).onSnapshot(function(s){
    S.dealRaw=s.exists?clone(s.data()):null;
    syncDeal(true);
    render();
  },subErr);
  db.doc('myscore/'+S.uid).onSnapshot(function(s){
    S.myscoreErr=null;S.myscore=s.exists?clone(s.data()):null;render();
  },function(e){S.myscoreErr=(e&&e.code)||'error';render();});
  db.collection('chat').recent(30,function(s){
    var prevLast=S.chat.length?S.chat[S.chat.length-1].ts:0,first=!S.chatLoaded;
    S.chat=s.docs.map(function(d){var x=d.data();x.id=d.id;return x;}).sort(function(a,b){return a.ts-b.ts;});
    S.chatLoaded=true;
    var fresh=S.chat.filter(function(m){return m.ts>prevLast&&m.name!==S.me;});
    if(!first){
      var nt=fresh.filter(function(m){return m.kind==='notice';}).pop();
      if(nt)toast('📢 '+nt.text);

    onChat();
  },subErr);

/* 카드는 뽑기를 열 때 이미 배정돼 있고, 플레이어가 "카드 뽑기"를 누르는 순간 내 카드가 공개돼요 */
/* ===== 경기 진행 상황 + "지금 쓰는 게 좋아요" 추천 ===== */
var GAMES=['bowl1','bowl2','ow1','ow2'];
function flow(){
  var R=S.pub.results||{},T=S.pub.teams||{},sets=T.sets||{},cur=T.current,idx=GAMES.indexOf(cur);
  return {cur:cur,idx:idx,inWindow:idx>=0&&!!sets[cur]&&!R[cur],afterWindow:idx>=0&&!!R[cur],
          left:idx>=0?GAMES.length-1-idx:GAMES.length,finalGame:cur==='ow2',finalDone:!!R.ow2};
}
function chanceInfo(hero,who){
  var f=flow(),c=canUseNow(hero,who);

  var R=S.pub.results||{};

    var o=tracerOptions()[0];
    if(!o)return {lvl:'none'};
    if(o.id.indexOf('ow2')>=0)return {lvl:'last',key:'tr:'+o.id,msg:'이번이 마지막 되돌리기 기회예요! 오버워치 2경기가 마지막 추첨이에요 — 지금 사용하는 게 좋아요!'};
    return {lvl:'now',key:'tr:'+o.id,msg:'방금 진행된 “'+o.label+'”을(를) 되돌릴 수 있어요! 다음 추첨이 시작되면 이 기회는 사라져요.'};
  }
  if(hero==='symmetra'){
    if(f.finalGame)return {lvl:'last',key:'sym:ow2',msg:'이번이 마지막 기회예요! 오버워치 2경기 결과가 나오면 더 이상 팀을 바꿀 수 없어요 — 지금 사용하는 게 좋아요!'};
    return {lvl:'now',key:'sym:'+f.cur,msg:'지금 팀을 바꿀 수 있는 구간이에요! 이 경기 결과가 나오면 이 구간은 끝나요. (이 뒤로 팀 교환 기회가 '+f.left+'번 더 남아 있어요)'};
  }
  if(hero==='reinhardt'){
    var u=(S.pub.used&&S.pub.used.used)||{},rel=recentUsed().filter(function(k){return u[k]&&(!u[k].aff||u[k].aff.indexOf(who)>=0);});
    if(rel.length){var x=heroOf(rel[0]);return {lvl:'now',key:'rein:'+rel[0]+u[rel[0]].ts,msg:'나를 대상으로 한 “'+x.hero+' — '+x.power+'”이(가) 방금 쓰였어요! 지금 방어할 수 있어요. 다음 초능력이 쓰이면 밀려나요.'};}
    if(f.finalDone||f.finalGame)return {lvl:'last',key:'rein:bonus',msg:'마지막 기회예요! 공격받지 않았다면 정산 전에 “방어 안 함 (+1점)” 보너스를 받아 두세요.'};
    return {lvl:'info',key:'rein:info',msg:'나를 대상으로 한 초능력이 쓰이면 바로 방어할 수 있어요. 공격받지 않았다면 정산 전에 보너스를 받아 두세요.'};
  }
  // 최종 정산 전까지 아무 때나 쓰는 초능력들
  if(f.finalDone)return {lvl:'last',key:'any:done',msg:'마지막 경기가 끝났어요! 곧 최종 정산이에요 — 아직 안 썼다면 지금 사용하세요!'};
  if(f.finalGame&&f.inWindow)return {lvl:'last',key:'any:ow2',msg:'마지막 경기(오버워치 2경기)가 진행 중이에요. 이 경기가 끝나면 곧 정산이에요 — 지금 사용하는 게 좋아요!'};
  if(f.cur==='ow1')return {lvl:'soon',key:'any:ow1',msg:'다음 경기(오버워치 2경기)가 마지막이에요. 잊지 말고 쓰세요!'};

var GUIDE_DEFAULT='원하는 타이밍에 사용해요. 손을 들고 이름을 크게 외친 뒤 공개 버튼을 눌러요.';
function canUseNow(hero,who){
  var f=S.pub.flags||{},R=S.pub.results||{},T=S.pub.teams||{},cur=T.current,sets=T.sets||{};
  if(isUsed(hero))return {ok:false,used:true,why:'이미 사용했어요'};
  if(hero==='echo')return {ok:false,wait:true,why:'마지막에 관리자가 호출하면 진행해요'};
  if(S.pub.final&&S.pub.final.published)return {ok:false,why:'점수가 공개돼서 사용 기간이 끝났어요'};
  if(f.powerClosed)return {ok:false,why:'관리자가 초능력 사용을 마감했어요'};
  if(hero==='symmetra'){
    if(GAMES.indexOf(cur)<0||!sets[cur]||teamOf(cur,who)<0)return {ok:false,why:'볼링·오버워치 팀이 정해진 뒤, 그 경기 시작 전에만 사용할 수 있어요 (점심 때는 못 써요)'};

/* 뽑기를 여는 순간 10명 전원의 초능력을 한꺼번에 랜덤 배정해요 (이유정은 항상 메르시) */
async function assignAll(){
  for(var attempt=0;attempt<3;attempt++){
    try{
      await withTimeout(assignTx(function(map){
        Object.keys(map).forEach(function(n){if(map[n]==='mercy'&&n!==HOST)delete map[n];});   // 메르시는 이유정 전용
        map[HOST]='mercy';
        var taken=Object.keys(map).map(function(k){return map[k];});
        var pool=shuffle(HEROES.map(function(h){return h.id;}).filter(function(id){return taken.indexOf(id)<0;}));
        PLAYERS.forEach(function(n){if(!map[n]&&pool.length)map[n]=pool.shift();});
      }),15000,'카드 배정');
      return true;
    }catch(e){console.error(e);await sleep(600*(attempt+1));}
  }
  return false;
}

/* =============== 저장 큐 =============== */
var Qp=Promise.resolve();
var busyT=null;
function updateBusy(){
  var el=$('#busy');if(!el)return;
  if(!S.admin){el.className='';return;}
  clearTimeout(busyT);
  if(S.busy>0){el.className='show';el.textContent='⏳ 서버에 저장 중… ('+S.busy+'건) 잠시만 기다려 주세요';}
  else if(el.className.indexOf('show')>=0){el.className='show done';el.textContent='✅ 저장 완료';busyT=setTimeout(function(){el.className='';},1500);}
}
function enqueue(fn){
  S.busy++;updateBusy();
  Qp=Qp.then(fn).catch(function(e){console.error(e);toast('저장 실패: '+((e&&(e.message||e.code))||'알 수 없는 오류'));})
    .then(function(){S.busy--;updateBusy();});
  return Qp;
}
var pendingPut={};
function put(path,data){            // 같은 문서를 연달아 저장하면 한 번으로 합쳐요 (쓰기 횟수 절약)
  var d=clone(data);
  if(pendingPut[path]){pendingPut[path].data=d;return Qp;}
  var rec={data:d};pendingPut[path]=rec;
  return enqueue(function(){var x=rec.data;delete pendingPut[path];return S.db.doc(path).set(x);});
}
/* 관리자 화면이 여러 개여도 점수 기록이 서로 덮어쓰이지 않도록, 저장할 때마다 서버 기록과 합쳐요 */
function mergeLedger(cur,loc){
  var s=cur||{},l=loc||{};
  if(cur&&s.gen&&l.gen&&s.gen!==l.gen)return s;                 // 다른 화면에서 초기화됨 → 서버 기준
  var del=Object.assign({},s.del||{},l.del||{}),ev={};
  (s.evts||[]).concat(l.evts||[]).forEach(function(e){if(!ev[e.id]||e.ts>ev[e.id].ts)ev[e.id]=e;});
  Object.keys(del).forEach(function(id){if(ev[id]&&del[id]>=ev[id].ts)delete ev[id];});
  var seen={},entries=[];
  (s.entries||[]).concat(l.entries||[]).forEach(function(en){
    var e=ev[en.evt];
    if(!e||e.ts!==en.ts||seen[en.id])return;
    seen[en.id]=1;entries.push(en);
  });
  var list=Object.keys(ev).map(function(k){return ev[k];}).sort(function(a,b){return a.ts-b.ts;});
  return {gen:s.gen||l.gen||'',evts:list,entries:entries,del:del};
}
var ledgerQueued=false;
function saveLedger(){
  schedSync();
  if(ledgerQueued)return Qp;          // 이미 저장 대기 중이면 그 저장에 함께 실려요
  ledgerQueued=true;
  return enqueue(function(){
    ledgerQueued=false;
    return S.db.transact('adminonly/ledger',function(cur){return mergeLedger(cur,clone(L()));})
      .then(function(res){if(res)A().ledger=mergeLedger(res,L());});
  });
}
function saveState(){var s=clone(A().state);delete s.assign;return put('adminonly/state',s);}
/* 초능력 배정은 전용 문서에서 트랜잭션으로만 바꿔요 (여러 화면이 동시에 배정해도 서로 덮어쓰지 않아요) */
async function assignTx(fn){
  var out,fin=null;
  await S.db.transact('adminonly/assign',function(cur){
    var base=(cur&&cur.map)||{},before=JSON.stringify(base),map=clone(base);
    out=fn(map);fin=map;
    return (cur&&JSON.stringify(map)===before)?undefined:{map:map};   // 바뀐 게 없으면 저장하지 않아요
  });
  if(fin)A().state.assign=fin;
  return out;
}

function addEvt(label,cat,items,opts){
  opts=opts||{};
  var id=opts.id||uuid();
  if(opts.id)delEvt(opts.id,true);
  var t=Math.max(Date.now(),((L().del||{})[id]||0)+1);
  var ev={id:id,label:label,cat:cat,ts:t};
  if(opts.lk)ev.lk=opts.lk;
  L().evts.push(ev);
  items.forEach(function(it){L().entries.push({id:uuid(),evt:id,name:it.name,d:it.d,cat:cat,note:it.note||label,ts:t});});
  if(!opts.quiet)saveLedger();
  return id;
}
function delEvt(id,quiet){
  L().del=L().del||{};L().del[id]=Date.now();
  L().evts=L().evts.filter(function(e){return e.id!==id;});
  L().entries=L().entries.filter(function(e){return e.evt!==id;});
  if(!quiet)saveLedger();
}
function hasEvt(id){return L().evts.some(function(e){return e.id===id;});}
function calc(){
  var r={};
  PLAYERS.forEach(function(n){r[n]={name:n,total:0,main:0,cats:{lunch:0,bowl:0,ow:0,power:0,bag:0,other:0}};});
  L().entries.forEach(function(e){
    var x=r[e.name];if(!x)return;
    x.total+=e.d;x.cats[e.cat]=(x.cats[e.cat]||0)+e.d;
    if(e.cat==='lunch'||e.cat==='bowl'||e.cat==='ow')x.main+=e.d;
  });
  return r;
}
function rank(T){
  var arr=Object.keys(T).map(function(k){return T[k];}).sort(function(a,b){return b.total-a.total||b.main-a.main||a.name.localeCompare(b.name,'ko');});
  arr.forEach(function(x,i){
    var p=arr[i-1];
    if(p&&p.total===x.total&&p.main===x.main){x.rank=p.rank;x.tie=true;p.tie=true;}else x.rank=i+1;
  });
  return arr;
}
function swapItems(a,b,T,label){
  var ta=T[a].total,tb=T[b].total;
  return [{name:a,d:tb-ta,note:label+' (점수 교환)'},{name:b,d:ta-tb,note:label+' (점수 교환)'}];
}

function setTeams(key,groups,note,title,extra){

/* 서버를 건드리기 전에, 지금 정말 처리할 일이 있는지 이 화면의 기억만으로 먼저 확인해요 */
function needsReconcile(){
  var a=A();
  if(!S.db||!a.content||!a.loaded.main||!a.loaded.deals)return false;
  var as=a.state.assign||{},fl=S.pub.flags||{},uids=Object.keys(S.players),k;
  for(k=0;k<uids.length;k++){
    var uid=uids[k],p=S.players[uid];if(!p)continue;
    var want=as[p.name],dl=a.deals[uid];
    if(want){if(!dl||dl.hero!==want||dl.name!==p.name)return true;}
    else if(p.drawReq&&fl.drawOpen)return true;
  }
  var dk=Object.keys(a.deals);
  for(k=0;k<dk.length;k++){var d=a.deals[dk[k]],pl=S.players[dk[k]];if(d&&(as[d.name]!==d.hero||!pl||pl.name!==d.name))return true;}
  return false;
}
async function reconcileDeals(){
  if(S.dealing){S.dealAgain=true;return;}
  if(!needsReconcile())return;
  var a=A();
  if(S.resetting||!S.db||!a.content||!a.loaded.main||!a.loaded.deals||!a.state)return;
  S.dealing=true;S.dealStart=Date.now();
  try{
    do{
      S.dealAgain=false;
      var ep=S.epoch||0;
      var uids=Object.keys(S.players);
      for(var i=0;i<uids.length;i++){
        if(S.resetting||ep!==(S.epoch||0)){S.dealAgain=!S.resetting;break;}
        var uid=uids[i],p=S.players[uid];
        if(!p)continue;
        var hero=a.state.assign[p.name];
        if(!hero){
          // (보험) 아직 배정되지 않은 사람이 뽑기를 눌렀을 때만 서버에서 확인하며 배정해요
          if(!p.drawReq||!(S.pub.flags&&S.pub.flags.drawOpen))continue;
          var tr=await withTimeout(S.db.transactMulti(['adminonly/assign','public/flags','players/'+uid],function(d){
            var map=clone((d[0]&&d[0].map)||{}),fl=d[1]||{},pl=d[2];
            if(map[p.name])return {hero:map[p.name]};
            if(!fl.drawOpen||!pl||pl.name!==p.name||!pl.drawReq)return {hero:null};
            var h2;
            if(p.name===HOST)h2='mercy';                       // 이유정은 항상 메르시 (본인이 뽑기를 눌렀을 때)
            else{
              var taken=Object.keys(map).map(function(k){return map[k];});
              var pool=HEROES.map(function(h){return h.id;}).filter(function(id){return id!=='mercy'&&taken.indexOf(id)<0;});
              if(!pool.length)return {hero:null};
              h2=pool[rnd(pool.length)];
            }
            map[p.name]=h2;
            return {hero:h2,write:{path:'adminonly/assign',data:{map:map}}};
          }),15000,'카드 배정');
          hero=tr&&tr.hero;
          if(tr&&tr.write)a.state.assign=tr.write.data.map;else if(hero)a.state.assign[p.name]=hero;
        }
        if(!hero)continue;
        if(S.resetting||ep!==(S.epoch||0)){S.dealAgain=!S.resetting;break;}
        var dl=a.deals[uid];
        if(!dl||dl.hero!==hero||dl.name!==p.name){
          var det=a.content.powers[hero]&&a.content.powers[hero].detail||[];
          var rec={name:p.name,hero:hero,detail:det,guide:(a.content.guides&&a.content.guides[hero])||'',ts:Date.now()};
          await withTimeout(S.db.doc('deal/'+uid).set(rec),15000,'카드 전달');
          a.deals[uid]=rec;
        }
      }
      if(!S.resetting){
        var dk=Object.keys(a.deals);
        for(var j=0;j<dk.length;j++){
          var d2=a.deals[dk[j]];
          var pl2=S.players[dk[j]];
          if(d2&&(a.state.assign[d2.name]!==d2.hero||!pl2||pl2.name!==d2.name)){
            try{await S.db.doc('deal/'+dk[j]).delete();}catch(er){console.error(er);}
            delete a.deals[dk[j]];
          }
        }
      }
    }while(S.dealAgain);
    S.dealErr=null;
  }catch(e){console.error(e);S.dealErr=(e&&(e.message||e.code))||'알 수 없는 오류';toast('카드 지급 실패 — 자동으로 다시 시도해요');}
  S.dealing=false;render();
}

/* =============== 내 점수 동기화 (관리자 화면 → 각자 본인만 읽는 문서) =============== */
var syncT=null,syncCache={};
function schedSync(){
  if(!S.admin||!S.db)return;
  clearTimeout(syncT);syncT=setTimeout(syncScores,700);
}
function syncScores(){
  if(!S.db||!S.admin||S.resetting||!A().loaded.main)return;
  Object.keys(S.players).forEach(function(uid){
    var p=S.players[uid];if(!p||!p.name)return;
    var items=L().entries.filter(function(e){return e.name===p.name;}).map(function(e){return {l:e.note,d:e.d,c:e.cat,t:e.ts};});
    var key=JSON.stringify([p.name,items]);
    if(syncCache[uid]===key)return;
    if(!items.length){                                   // 받은 점수가 없으면 문서를 만들지 않고, 있던 문서는 지워요
      var had=syncCache[uid]!==undefined;
      syncCache[uid]=key;
      if(had)enqueue(function(){return S.db.doc('myscore/'+uid).delete();});
      return;
    }
    syncCache[uid]=key;
    var total=items.reduce(function(a,x){return a+x.d;},0);
    enqueue(function(){return S.db.doc('myscore/'+uid).set({name:p.name,total:total,items:items,ts:Date.now()});});
  });
}

function unlockPop(id){
  if(S.pop&&S.pop.ev.id===id&&S.pop.locked){
    S.pop.locked=false;
    var b=$('#pop .waitbtn');
    if(b)b.outerHTML='<button class="btn block ghost" style="margin-top:14px" data-act="popClose">닫기</button>';
  }
}
function outcomeHead(p){
  var pl=p.pool&&p.pool[S.me];
  if(!pl||!p.winName)return '';
  return pl.kind==='win'?'<div class="outc win">🏆 <b>'+esc(p.winName)+' 승리!</b><br>승리팀 점수 봉투를 뽑아요</div>':'<div class="outc lose">😅 <b>'+esc(p.loseName||'')+'</b>은 아쉽게 패배…<br>패배팀 점수 봉투를 뽑아요</div>';
}
function runSwap(ev){
  var p=ev.payload||{};
  function ok(){return S.pop&&S.pop.ev.id===ev.id;}
  var els=document.querySelectorAll('#pop .sn');
  setTimeout(function(){
    if(!ok())return;
    var t0=Date.now(),dur=1700;
    var iv=setInterval(function(){
      if(!ok()){clearInterval(iv);return;}
      var k=Math.min(1,(Date.now()-t0)/dur);
      els.forEach(function(e){
        var f=+e.getAttribute('data-from'),t=+e.getAttribute('data-to');
        e.textContent=String(Math.round(f+(t-f)*k));
        if(k>=1){e.classList.add('done');e.classList.add(t>f?'up':t<f?'down':'');}
      });
      if(k>=1){
        clearInterval(iv);
        var m=$('#swmsg');
        if(m)m.innerHTML='<div class="outc '+(p.verdict==='good'?'win':'lose')+'" style="font-size:17px">'+esc(p.msg||'')+'</div>';
      }
    },60);
  },700);
}
function diceReaction(ev){
  var p=ev.payload,h=0,i;
  for(i=0;i<ev.id.length;i++)h+=ev.id.charCodeAt(i);
  if(S.me===p.who)return p.delta>0?'<p class="win"><b>🎉 대박이에요!!</b></p>':'<p style="font-weight:700">😭 쪽박… 다음엔 꼭!</p>';
  var pos=p.delta>0,mate=(p.mates||[]).indexOf(S.me)>=0;
  var A1=['부러워요 ㅠㅠ','와 인정… 나도 대박 나고 싶다 😭','복권이라도 사야겠어요 👏'],A2=['ㅋㅋㅋ 쪽박이네요~ 😝','아이고~ 안타깝지만 웃음이 나요 ㅎㅎ','이게 도박의 맛이죠 😏'];
  var line=(pos?A1:A2)[h%3];
  return '<p class="quote">'+(mate?'👥 같은 팀 ':'')+esc(p.who)+' 님 — '+line+'</p>';
}
function runEnvs(ev){
  var env=S.pop&&S.pop.env;if(!env)return;
  var n=env.n,slots=[],i;
  for(i=0;i<n;i++)slots[i]=i;
  function ok(){return S.pop&&S.pop.ev.id===ev.id;}
  function el(k){return document.querySelector('#cards5 .cd[data-i="'+k+'"]');}
  function place(){for(var s=0;s<n;s++){var c=el(slots[s]);if(c)c.style.left=(s*20)+'%';}}
  function step(t,txt){setTimeout(function(){if(!ok())return;var e=$('#estep');if(e)e.textContent=txt;},t);}
  step(1700,'봉투를 뒤집어요… 🔄');
  setTimeout(function(){if(!ok())return;for(var k=0;k<n;k++){var c=el(k);if(c)c.classList.add('flip');}},1800);
  step(2500,'섞는 중… 🌀');
  for(var t=2600;t<=5000;t+=300){(function(tt){setTimeout(function(){
    if(!ok())return;
    var a=rnd(n),b=rnd(n);if(a===b)b=(b+1)%n;
    var x=slots[a];slots[a]=slots[b];slots[b]=x;place();
  },tt);})(t);}
  step(5100,'내 봉투는 어떤 걸까요? 👀');
  var last=-1;
  for(var u=5200;u<=6500;u+=180){(function(tt){setTimeout(function(){
    if(!ok())return;
    var r=rnd(n);if(r===last)r=(r+1)%n;last=r;
    document.querySelectorAll('#cards5 .cd').forEach(function(c){c.classList.remove('scan');});
    var c=el(slots[r]);if(c)c.classList.add('scan');
  },tt);})(u);}
  setTimeout(function(){
    if(!ok())return;
    document.querySelectorAll('#cards5 .cd').forEach(function(c){c.classList.remove('scan');c.classList.remove('flip');c.classList.add('dim');});   // 안 뽑힌 봉투도 앞면(점수)을 어둡게 보여줘요
    var pk=el(env.pick);
    if(pk){pk.classList.remove('dim');pk.classList.add('chosen');}
    var e=$('#estep');if(e)e.textContent='뽑혔어요! 🎉';
    var r=$('#envres');if(r)r.innerHTML=env.html;
  },6700);
}
function runCards(ev){
  var p=ev.payload||{},n=(p.cards||[]).length,slots=[],i,alive=true;
  for(i=0;i<n;i++)slots[i]=i;                 // slots[자리]=카드번호
  function ok(){return alive&&S.pop&&S.pop.ev.id===ev.id;}
  function el(i){return document.querySelector('#cards3 .cd[data-i="'+i+'"]');}
  function place(){for(var s=0;s<n;s++){var c=el(slots[s]);if(c)c.style.left=(s*34)+'%';}}
  function step(t,txt){setTimeout(function(){if(!ok())return;var e=$('#cstep');if(e)e.textContent=txt;},t);}
  // 1) 3장을 보여줘요 → 2) 뒤집어요 → 3) 섞어요 → 4) 뽑아요
  step(1700,'카드를 뒤집어요… 🔄');
  setTimeout(function(){if(!ok())return;for(var k=0;k<n;k++){var c=el(k);if(c)c.classList.add('flip');}},1800);
  step(2500,'섞는 중… 🌀');
  for(var t=2600;t<=5000;t+=300){(function(tt){setTimeout(function(){
    if(!ok())return;
    var a=rnd(n),b=rnd(n);if(a===b)b=(b+1)%n;
    var x=slots[a];slots[a]=slots[b];slots[b]=x;place();
  },tt);})(t);}
  step(5100,'어떤 카드가 뽑힐까요? 👀');
  var last=-1;
  for(var u=5200;u<=6500;u+=180){(function(tt){setTimeout(function(){
    if(!ok())return;
    var r=rnd(n);if(r===last)r=(r+1)%n;last=r;
    var cs=document.querySelectorAll('#cards3 .cd');cs.forEach(function(c){c.classList.remove('scan');});
    var c=el(slots[r]);if(c)c.classList.add('scan');
  },tt);})(u);}
  setTimeout(function(){
    if(!ok())return;
    var cs=document.querySelectorAll('#cards3 .cd');cs.forEach(function(c){c.classList.remove('scan');c.classList.remove('flip');c.classList.add('dim');});   // 안 뽑힌 카드도 앞면을 어둡게 보여줘요
    var pk=el(p.pick);
    if(pk){pk.classList.remove('dim');pk.classList.add('chosen');}
    var c=(p.cards||[])[p.pick]||{};
    var nt=$('#cnote');if(nt)nt.innerHTML='<div class="outc win">🍀 <b>'+esc(c.t||'')+'</b> 당첨!<br>'+esc(c.d||'')+'</div>';
    var e=$('#cstep');if(e)e.textContent='뽑혔어요! 🎉';
  },6700);
}
function runDraw(ev){

  },last+500);

/* 볼링 1세트 밸런스 팀 나누기: 남자 2 + 여자 3 / 남자 3 + 여자 2 (김세환은 항상 "남자 2" 쪽) */
function balancedBowl(){
  var females=PLAYERS.filter(function(n){return MALES.indexOf(n)<0;});
  var others=shuffle(MALES.filter(function(n){return n!=='김세환';}));
  var f=shuffle(females);
  var teamTwo=shuffle(['김세환',others[0]].concat(f.slice(0,3)));     // 남2 + 여3
  var teamThree=shuffle(others.slice(1).concat(f.slice(3)));          // 남3 + 여2
  return rnd(2)===0?[teamTwo,teamThree]:[teamThree,teamTwo];          // 어느 쪽이 A팀인지는 랜덤
}

/* 점수 봉투 팝업용: 이번 팀이 받는 봉투 전체 + 높은/낮은 점수 구분 */
function envPool(names,vals,kind){
  var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),out={};
  return {vals:vals.slice().sort(function(a,b){return b-a;}),kind:kind,mx:mx,mn:mn};
}
function addPools(pool,members,assign,vals,kind){
  var ep=envPool(members,vals,kind);
  members.forEach(function(n){pool[n]={vals:ep.vals,kind:kind,tier:assign[n]===ep.mx?'high':assign[n]===ep.mn?'low':''};});
}

function owResult(key,gi,via){
  var t=team(key);if(!t)return toast('먼저 팀을 공개하세요');
  setLast('score:'+key);
  if(S.pub.vote&&S.pub.vote.key===key&&S.pub.vote.open)owVoteClose(key,true);
  var win=t.groups[gi].m.slice(),lose=t.groups[1-gi].m.slice(),assign={},items=[],pi=[],bonus={};
  var wv=shuffle(OW_WIN),lv=shuffle(OW_LOSE);
  win.forEach(function(n,i){assign[n]=wv[i];items.push({name:n,d:wv[i],note:GAME[key]+' 승리 기본 점수'});});
  lose.forEach(function(n,i){assign[n]=lv[i];items.push({name:n,d:lv[i],note:GAME[key]+' 패배 기본 점수'});});
  var bets=(S.pub.bets&&S.pub.bets[key]&&S.pub.bets[key].map)||{};
  PLAYERS.forEach(function(n){
    var b=bets[n];if(!b)return;
    var onWin=win.indexOf(n)>=0;
    if((b==='win')===onWin){pi.push({name:n,d:1,note:GAME[key]+' 승부 예측 성공'});bonus[n]=1;}
  });

  addEvt(GAME[key]+' 승부 예측 성공','ow',pi,{id:'pred:'+key});
  var predNames=pi.map(function(z){return z.name;});
  var R=clone(S.pub.results)||{};R[key]={win:win,team:gi,pred:predNames};S.pub.results=R;saveResults();
  var pool={};addPools(pool,win,assign,OW_WIN,'win');addPools(pool,lose,assign,OW_LOSE,'lose');
  announce('private','✉️ '+GAME[key]+' 점수 봉투'+(via?' (다시 뽑기)':''),{assign:assign,bonus:bonus,pool:pool,unit:'점',fmt:'plain',label:'기본 점수',via:via||'',winName:t.groups[gi].n,loseName:t.groups[1-gi].n,predWinners:predNames},
    (via?'⏪ '+via+' ':'')+'🎮 '+GAME[key]+' 결과! '+t.groups[gi].n+' 승리!!!! '+(pi.length?'예측 성공: '+pi.map(function(x){return x.name;}).join(', ')+' (+1점)':'예측 성공자 없음'));

function runUse(uid,p,u){
  var a=A(),res,o=u.opts||{};
  try{
    var hero=a.state.assign[p.name];
    if(!hero||hero!==u.hero)res=fail('내 초능력이 아니에요');
    else if(hero==='echo')res=fail('에코는 관리자가 진행해요');
    else if(isUsed(hero))res=fail('이미 사용한 초능력이에요');
    else{
      var cu=canUseNow(hero,p.name);
      if(!cu.ok)res=fail(cu.why);
      else if(hero==='cassidy')res=duelStart(p.name,o.target);
      else res=execPower(hero,o);
    }
  }catch(e){console.error(e);res=fail('처리 중 오류가 났어요');}
  var done={ts:u.ts,ok:!!res.ok,msg:res.msg||'',hero:u.hero};
  S.db.doc('players/'+uid).update({useDone:done}).catch(function(e){console.error(e);});
  render();
}
function processUses(){
  var a=A();
  if(!S.db||!a.content||!a.loaded.main||!a.state)return;
  Object.keys(S.players).forEach(function(uid){
    var p=S.players[uid];
    if(!p||!p.useReq)return;
    var u=p.useReq,key=uid+':'+u.ts;
    if(S.handledUse[key])return;
    S.handledUse[key]=true;
    // 여러 관리자 화면이 켜져 있어도 요청 하나는 한 화면만 처리하도록 먼저 "내가 처리할게요" 표시를 해요
    S.db.transact('players/'+uid,function(cur){
      if(!cur||!cur.useReq||cur.useReq.ts!==u.ts)return undefined;
      var n=Object.assign({},cur);n.useReq=null;n.useDone={ts:u.ts,pending:true,hero:u.hero};return n;
    }).then(function(claimed){if(claimed)runUse(uid,p,u);}).catch(function(e){console.error(e);S.handledUse[key]=false;});
  });
}

    /* 마지막 확인: 남은 게 없는지 */
    for(var c2=0;c2<colls.length;c2++){left+=(await db.collection(colls[c2]).list()).length;}
    toast(failed||left?'⚠️ 일부 데이터가 남았을 수 있어요 ('+(failed+left)+'건). 한 번 더 눌러 주세요':'✅ 초기화 완료! 모든 데이터가 깨끗하게 지워졌어요');
  }catch(e){
    console.error(e);toast('⚠️ 초기화 중 오류가 났어요: '+(e.message||e.code)+' — 한 번 더 눌러 주세요');
  }finally{
    S.busy--;
    setTimeout(function(){S.resetting=false;S.dealAgain=false;adminTick();render(true);},1200);
    render(true);
  }
}

/* =============== 모달 =============== */
function renderModal(){
  var el=$('#modal');if(!el)return;
  var m=S.modal;
  if(!m){el.innerHTML='';return;}
  if(m.type==='pw')el.innerHTML=pwModal();
  else if(m.type==='lucky')el.innerHTML=luckyModal();
  else if(m.type==='rein')el.innerHTML=reinModal();
  else if(m.type==='tracer')el.innerHTML=tracerModal();
  else if(m.type==='confirm'){
    el.innerHTML='<div class="ov"><div class="box big" data-stop="1"><h3>확인</h3><p>'+esc(m.msg)+'</p><div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" data-act="modalClose">취소</button><button class="btn bad" style="flex:1" data-act="confirmYes">확인</button></div></div></div>';
  }
}
function ask(msg,fn){S.modal={type:'confirm',msg:msg,fn:fn};renderModal();}

/* =============== 이벤트 =============== */
document.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-bind');
  if(!k)return;
  if(k.indexOf('ui.gifts.')===0){
    if(!S.ui.gifts)S.ui.gifts=((S.pub.gifts&&S.pub.gifts.list)||[]).slice();
    S.ui.gifts[+k.split('.')[2]]=t.value;
  }else setPath(k,t.value);
});
document.addEventListener('compositionstart',function(){S.composing=true;});
document.addEventListener('compositionend',function(){S.composing=false;if(S.pending)setTimeout(function(){render();},50);});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){S.hiddenAt=Date.now();return;}
  // 오래(90초 이상) 꺼져 있다가 돌아왔을 때만 실시간 연결을 새로 만들어요 (잦은 재연결 = 읽기 낭비)
  if(S.admin&&S.db&&S.hiddenAt&&Date.now()-S.hiddenAt>90000){adminOff();adminSubs();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='chatin'){e.preventDefault();sendChat();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(!t||!t.files||!t.files[0])return;
  if(t.id!=='seedfile'&&t.id!=='pinfile'&&t.id!=='pinfile2')return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(t.id==='pinfile')return doSetup(o);
      if(t.id==='pinfile2')return doPinChange(o);
      if(!o.powers||!o.lunch)throw new Error('파일 형식이 달라요');
      put('adminonly/content',{powers:o.powers,params:o.params,lunch:o.lunch,quotes:o.quotes||{},guides:o.guides||{}});
      toast('비밀 데이터를 올렸어요');
    }catch(er){toast('올리기 실패: '+er.message);}
  };
  r.readAsText(t.files[0]);
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t)return;
  if(t.classList.contains('ov')&&e.target!==t)return;
  handle(t.getAttribute('data-act'),t.getAttribute('data-v'),t);
});
async function handle(act,v,t){
  var u=S.ui,k=t.getAttribute('data-k');
  switch(act){
    case 'menu':S.menu=!S.menu;break;
    case 'menuClose':S.menu=false;break;
    case 'go':S.view=v;S.menu=false;window.scrollTo(0,0);if(v==='chat'){render(true);markChatSeen();setTimeout(function(){window.scrollTo(0,document.body.scrollHeight);},60);return;}break;
    case 'sel':
      if(k==='modal.inc'||k==='ui.use.inc')v=(v==='1');
      if(k==='ui.use.mode'){u.use.evt=null;}
      if(k==='ui.focus'&&u.focus===v)v='';
      setPath(k,v);break;
    case 'ta':{
      var arr=(getPath(k)||[]).slice(),mx=+t.getAttribute('data-max'),i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1);
      else if(mx===1)arr=[v];
      else if(arr.length>=mx){toast('최대 '+mx+'명까지 선택할 수 있어요');break;}
      else arr.push(v);
      setPath(k,arr);break;}
    case 'tog':{
      var mm=getPath(k);if(!mm){mm={};setPath(k,mm);}
      if(t.getAttribute('data-def'))mm[v]=(mm[v]===false);else mm[v]=!mm[v];
      break;}
    case 'guest':S.guest=true;break;
    case 'relogin':S.guest=false;S.menu=false;window.scrollTo(0,0);if(!S.db||!S.uid)toast(connMsg());break;
    case 'setupDone':location.hash='';S.setup=false;break;
    case 'setupOpen':S.setup=true;S.ui.setupMsg='';window.scrollTo(0,0);break;
    case 'login':return doLogin();
    case 'logout':return doLogout();
    case 'draw':
      try{await S.db.doc('players/'+S.uid).update({drawReq:Date.now()});setTimeout(maybeDealPop,80);}
      catch(er){toast('요청 실패: '+(er.message||er.code));}
      break;
    case 'replay':if(S.pub.live)showPop(S.pub.live);return;
    case 'popClose':if(S.pop&&S.pop.locked)return;closePop();return;
    case 'privOpen':if(S.pop){S.pop.open=true;renderPop();}return;
    case 'modalClose':S.modal=null;break;
    case 'confirmYes':{var fn=S.modal&&S.modal.fn;S.modal=null;render(true);if(fn)fn();return;}
    case 'bc':S.broadcast=!S.broadcast;break;
    case 'chatSend':sendChat();return;
    case 'asNotice':u.asNotice=!u.asNotice;break;
    case 'notice':{var nt=NOTICES[+v];if(nt){postChat('notice',nt.m,'공지');toast('공지를 보냈어요');}return;}
    case 'manD':u.manual.d=+v;break;
    case 'manAdd':
      if(!u.manual.name)return toast('대상을 선택하세요');
      addEvt('수동 조정 · '+u.manual.name+(u.manual.note?' ('+u.manual.note+')':''),'other',[{name:u.manual.name,d:u.manual.d,note:'수동 조정'+(u.manual.note?' · '+u.manual.note:'')}]);
      u.manual.note='';toast('반영했어요');break;
    case 'delEvt':{var id=v;ask('이 점수 기록을 삭제할까요?',function(){delEvt(id);if(id.indexOf('pw:')===0){var hid=id.slice(3),U=clone(S.pub.used)||{};if(U.used&&U.used[hid]){delete U.used[hid];S.pub.used=U;saveUsed();}}render(true);});return;}
    case 'ltSave':ltSave();break;
    case 'tBowl1':{
      var hasB=!!team('bowl1')||L().evts.some(function(e){return e.cat==='bowl';});
      if(hasB){ask('이미 1세트 팀을 뽑았어요! 정말 다시 뽑을까요? (지금까지의 볼링 팀·결과·점수가 모두 지워져요)',function(){toast('다시 뽑는 중… 서버에 저장하느라 몇 초 걸릴 수 있어요');clearBowl();tBowl1();render(true);});return;}
      tBowl1();break;}
    case 'bowlWin':{var bw=v.split(':');bowlResult(bw[0],+bw[1]);break;}
    case 'scoutStart':scoutStart();break;
    case 'scoutPick':{var sp=v;ask(sp+' 님을 영입할까요? 패배팀 방출자가 랜덤으로 정해져요.',function(){scoutPick(sp);render(true);});return;}
    case 'popGo':{closePop();S.view=v;S.menu=false;window.scrollTo(0,0);break;}
    case 'bowlCancel':{var bk=v;ask(GAME[bk]+' 결과를 취소할까요? 이 세트의 기본 점수가 모두 취소돼요.',function(){bowlCancel(bk);render(true);});return;}
    case 'owCancel':{var ok2=v;ask(GAME[ok2]+' 결과를 취소할까요? 기본 점수와 예측 점수가 모두 취소돼요.',function(){owCancel(ok2);render(true);});return;}
    case 'bowl2Reset':ask('2세트 팀과 2세트 점수를 초기화할까요?',function(){bowl2Reset();render(true);});return;
    case 'mtSave':mtSave();break;
    case 'gn':u.gn=+v;break;
    case 'tPick':tPick();break;
    case 'luckyOpen':S.modal={type:'lucky',key:v,stage:0,thrower:null,kind:null,rec:null};break;
    case 'luckyPick':luckyPick(v);break;
    case 'luckyRandom':luckyRandom();break;
    case 'luckyApply':luckyApply();break;
    case 'owDraw':{
      var okey=v;
      if(team(okey)){ask('이미 '+GAME[okey]+' 팀을 뽑았어요! 정말 다시 뽑을까요? (이 경기의 결과·점수·예측이 모두 지워져요)',function(){owDraw(okey);render(true);});return;}
      owDraw(okey);break;}
    case 'owBet':owBet(t.getAttribute('data-r'),t.getAttribute('data-n'),v);break;
    case 'owVoteOpen':owVoteOpen(v);break;
    case 'owVoteClose':owVoteClose(v);break;
    case 'voteSet':return sendVote(v);
    case 'voteHide':{var av=activeVote();if(av)S.voteSeen[av.id]=true;break;}
    case 'reinOpen':S.modal={type:'rein'};break;
    case 'tracerOpen':S.modal={type:'tracer'};break;
    case 'tracerPick':{var tp=v,tl=tracerOptions().filter(function(x){return x.id===tp;})[0];ask((tl?tl.label:'이 추첨')+'을(를) 다시 진행할까요? 모두에게 바로 공개돼요.',function(){S.modal=null;sendUse('tracer',{target:tp});});return;}
    case 'reinPick':{var rp=v,rx=heroOf(rp);ask(rx.hero+' — '+rx.power+'을(를) 막을까요? 모두에게 공개돼요.',function(){S.modal=null;sendUse('reinhardt',{mode:'defend',evt:'pw:'+rp});});return;}
    case 'reinBonus':ask('방어 없이 보너스(+1점)를 받을까요? 모두에게 공개돼요.',function(){sendUse('reinhardt',{mode:'bonus'});});return;
    case 'owResult':{var pr=v.split(':');owResult(pr[0],+pr[1]);break;}
    case 'lunchT':lunchSet(t.getAttribute('data-r'),+v,t.getAttribute('data-s'));break;
    case 'lunchHost':{
      var sc=hostScore();
      addEvt('점심 '+HOST+' 평균 점수 ('+sc+'점)','lunch',[{name:HOST,d:sc,note:'점심 · 나머지 평균(반올림)'}],{id:'lunch:host'});
      var by={},T0=calc(),tl=team('lunch');
      if(tl)tl.groups.forEach(function(g,gi){
        var rounds=lunchRounds().map(function(r){return {l:rLabel(r),s:lunchState(r,gi)};});
        g.m.forEach(function(n){by[n]={team:g.n,rounds:rounds,total:T0[n].cats.lunch};});
      });
      by[HOST]={host:true,total:T0[HOST].cats.lunch};
      announce('lunchres','🍽️ 점심 결과 발표!',{by:by,go:'mine',goLabel:'🧾 내 점수 보기'},'🍽️ 점심 결과 발표!!!! 각자 팝업에서 우리 팀의 성공/실패와 획득 점수를 확인하세요');
      toast(HOST+' '+sc+'점 지급 · 모두에게 결과를 알렸어요');break;}
    case 'drawOpen':{
      var f=clone(S.pub.flags)||{},turnOn=!f.drawOpen;
      if(turnOn){
        // 새 라운드(배정이 비어 있을 때)라면 남아 있는 옛 확인 기록부터 지워요
        if(!Object.keys(A().state.assign||{}).length){
          await Promise.all(Object.keys(S.players).filter(function(uid){return S.players[uid]&&S.players[uid].drawReq;}).map(function(uid){
            return S.db.doc('players/'+uid).update({drawReq:null}).catch(function(e){console.error(e);});
          }));
        }
        toast('🎴 10명의 초능력을 배정하는 중…');
        var okAll=await assignAll();
        if(!okAll){toast('⚠️ 카드 배정에 실패했어요. 인터넷 상태를 확인하고 다시 눌러 주세요');break;}
      }
      f.drawOpen=turnOn;S.pub.flags=f;saveFlags();
      if(f.drawOpen){
        announce('announce','🎴 초능력 카드 추첨 시작!',{emoji:'🔮',lines:['카드가 이미 배정됐어요!','“초능력 뽑기” 메뉴에서 내 타이밍에 카드를 뽑아 확인하세요'],go:'power',goLabel:'🔮 초능력 뽑기로 이동'},'🎴 초능력 카드 추첨이 시작됐어요!!!! 카드는 이미 배정됐어요. 초능력 뽑기 메뉴에서 내 타이밍에 뽑아서 확인하세요');
        toast('✅ 배정 완료 — 관리자 화면에 모든 정보가 들어왔어요');
      }
      break;}
    case 'resync':adminOff();adminSubs();toast('🔄 실시간 연결을 다시 만들었어요');break;
    case 'gcPlayers':{
      var dups=dupPlayers();
      ask('옛 접속 기록 '+dups.length+'건을 정리할까요? (가장 최근 로그인만 남아요)',async function(){
        await Promise.all(dups.map(function(uid){return Promise.all([S.db.doc('players/'+uid).delete().catch(function(){}),S.db.doc('myscore/'+uid).delete().catch(function(){}),S.db.doc('deal/'+uid).delete().catch(function(){})]);}));
        toast('🧹 '+dups.length+'건을 정리했어요');render(true);
      });return;}
    case 'expOk':S.expNotice=[];break;
    case 'chanceOk':S.chanceNotice=[];break;
    case 'powerClose':{
      var pf=clone(S.pub.flags)||{};pf.powerClosed=!pf.powerClosed;S.pub.flags=pf;saveFlags();
      if(pf.powerClosed)announce('announce','⏰ 초능력 사용 마감!',{emoji:'⏰',lines:['초능력 사용이 마감됐어요!','에코를 제외한 초능력은 이제 사용할 수 없어요','아직 안 쓴 사람은 관리자에게 문의하세요']},'⏰ 초능력 사용이 마감됐어요!!!! 에코를 제외한 초능력은 이제 사용할 수 없어요');
      else announce('announce','🔓 초능력 사용 다시 열림',{emoji:'🔓',lines:['초능력 사용이 다시 열렸어요']},'🔓 초능력 사용이 다시 열렸어요');
      break;}
    case 'dealFix':S.dealing=false;S.dealErr=null;reconcileDeals();toast('🔧 카드를 다시 맞추는 중이에요');break;
    case 'drawRetry':try{await S.db.doc('players/'+S.uid).update({drawReq:Date.now()});toast('다시 요청했어요');}catch(er){toast('요청 실패: '+(er.message||er.code));}break;
    case 'revealUse':revealUse(v);break;
    case 'sampleAssign':ask('현재 초능력 배정과 사용 기록이 샘플로 바뀌어요. 랜덤 배정할까요?',function(){sampleAssign();render(true);});return;
    case 'sampleTeams':sampleTeams();break;
    case 'samplePoints':samplePoints();break;
    case 'sampleClear':sampleClear();break;
    case 'pwOpen':{
      var dl=(v==='cassidy'&&A().state.duel)?A().state.duel:null;
      S.modal={type:'pw',hero:v,target:dl?dl.target:null,res:null,inc:null,mode:null,evt:null,duel:!!dl,called:(v==='echo'&&!!A().state.echo)};break;}
    case 'duelOpen':duelOpen();break;
    case 'echoCall':echoCall();break;
    case 'pwRun':return pwRun();
    case 'pwUndo':{var hh=v;ask('이 초능력 사용을 취소할까요? 공개와 점수 변동을 모두 되돌려요.',function(){pwUndo(hh);render(true);});return;}
    case 'useGo':{
      if(!S.deal||!revealed())return toast('먼저 초능력 카드를 뽑아 주세요');
      var uh=S.deal.hero,uo=u.use,o={},uerr='';
      if(uh==='echo')return toast('에코는 관리자가 진행해요');
      if(uh==='sigma'){if(uo.inc!==true&&uo.inc!==false)uerr='본인 포함 여부를 선택하세요';o.inc=uo.inc;}
      if(uh==='moira'||uh==='cassidy'||uh==='symmetra'){if(!uo.target)uerr='대상을 선택하세요';o.target=uo.target;}
      if(uh==='reinhardt'){if(!uo.mode)uerr='방어 여부를 선택하세요';else if(uo.mode==='defend'&&!uo.evt)uerr='무효화할 초능력을 선택하세요';o.mode=uo.mode;o.evt=uo.evt||null;}
      if(uerr)return toast(uerr);
      ask('모두에게 공개돼요. 되돌릴 수 없어요. 공개할까요?',async function(){
        try{await S.db.doc('players/'+S.uid).update({useReq:{hero:uh,opts:o,ts:Date.now()},useDone:null});}
        catch(er){toast('요청 실패: '+(er.message||er.code));}
        render(true);
      });return;}
    case 'publish':publishFinal();toast('점수를 공개했어요');break;
    case 'unpublish':{var F=clone(S.pub.final)||{};F.published=false;S.pub.final=F;put('public/final',F);toast('다시 숨겼어요');break;}
    case 'saveGifts':{var gl={list:(u.gifts||[]).slice(0,10)};S.pub.gifts=gl;put('public/gifts',gl);toast('저장했어요');break;}
    case 'resetAll':ask('점수·팀·초능력 배정·공개 상태·채팅을 모두 지울까요? 되돌릴 수 없어요.',resetAll);return;
  }
  render(true);
}
window.addEventListener('hashchange',function(){S.setup=(location.hash==='#setup');if(S.ready)render(true);});
var started=false;
function boot(){if(started)return;started=true;init();}
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading')boot();

})();
